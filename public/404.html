<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Page introuvable · FestiConnect</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#fcf8f2">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;display=swap">
  <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Aller au contenu</a>
  <header class="site-header" data-header></header>

  <main id="main" tabindex="-1">
    <div class="container lost">
      <img class="lost-art" src="/assets/img/lost.svg" alt="" width="320" height="200">
      <h1>Cette page n'existe pas</h1>
      <p class="lead">Le lien est peut-être incomplet, ou la page a été déplacée. Cherche directement ce que tu voulais voir :</p>
      <form class="search-bar" action="/evenements.html" method="get" role="search" aria-label="Rechercher un événement">
        <div class="input-icon">
          <span data-icon="search"></span>
          <label class="sr-only" for="lost-q">Artiste, événement ou lieu</label>
          <input class="input" id="lost-q" name="q" type="search" placeholder="Artiste, festival, lieu…" enterkeyhint="search">
        </div>
        <button class="btn btn-primary" type="submit"><span>Rechercher</span></button>
      </form>
      <div class="cluster mt-4">
        <a class="btn" href="/"><span data-icon="home"></span><span>Accueil</span></a>
        <a class="btn" href="/evenements.html"><span data-icon="ticket"></span><span>Événements</span></a>
        <a class="btn btn-ghost" href="/aide.html"><span data-icon="help"></span><span>Aide</span></a>
      </div>
    </div>
  </main>

  <footer class="site-footer" data-footer></footer>
  <nav class="tabbar" data-tabbar></nav>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/ui.js"></script>
</body>
</html>
