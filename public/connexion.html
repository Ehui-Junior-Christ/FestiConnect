<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion - FestiConnect</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body>
  <nav class="nav" data-nav></nav>
  <main class="section">
    <div class="container grid grid-2">
      <div>
        <span class="eyebrow">Accès sécurisé</span>
        <h1>Connexion</h1>
        <p class="lead">Accède à tes billets, ventes, validations ou paramètres selon ton rôle.</p>
      </div>
      <form id="login-form" class="panel glass grid">
        <label class="label">Email<input class="input" type="email" name="email" required></label>
        <label class="label">Mot de passe<input class="input" type="password" name="password" required></label>
        <button class="btn btn-primary" type="submit"><i data-lucide="log-in"></i>Se connecter</button>
        <p class="muted">Pas encore de compte ? <a class="text-white" href="/inscription.html">Inscription</a></p>
      </form>
    </div>
  </main>
  <footer class="footer" data-footer></footer>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/ui.js"></script>
  <script src="/assets/js/auth.js"></script>
</body>
</html>
