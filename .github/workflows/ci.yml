name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: npm test (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Les tests utilisent une base SQLite locale (`file:`) creee a la volee :
      # aucun secret Turso n'est necessaire.
      - run: npm test
        env:
          NODE_ENV: test
          APP_SECRET: ci-only-not-a-real-secret
